server.port=8080

# Database configuration
# Set the DB_PASSWORD environment variable before starting the app:
#   Windows PowerShell: $env:DB_PASSWORD="yourpassword"
#   Linux/Mac:          export DB_PASSWORD=yourpassword
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/takenote_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool settings (Stay below Clever Cloud Free limit of 5 connections)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate properties
# Bug #13 fix: Removed hardcoded password fallback (was ${DB_PASSWORD:18072004By@})
# Bug #9  fix: Updated from deprecated MySQL8Dialect to MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# Bug #14 fix: secret is required via JWT_SECRET env variable — no hardcoded fallback
#   Windows PowerShell: $env:JWT_SECRET="your-super-secret-key-min-32-chars"
#   Linux/Mac:          export JWT_SECRET=your-super-secret-key-min-32-chars
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000