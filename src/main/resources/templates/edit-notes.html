<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org" th:replace="~{ base :: layout( ~{::title}, ~{::section} ) }">
<head>
<meta charset="UTF-8">
<title>Edit Notes:: Take Note</title>
</head>
<body>
<section>

	<div class="container mt-3">
		<div class="row">
			<!-- Bug #16 Fixed: was using th:each="note: ${notes}" over a single Notes object.
			     Now uses th:if + direct ${notes} object reference. Controller provides a single
			     Notes entity via model.addAttribute("notes", notes). -->
			<div class="col-md-6 offset-md-3" th:if="${notes != null}">
				<div class="card mt-3">

					<div class="card-header text-center">
						<h3>Edit Your Notes</h3>
					</div>

					<div class="card-body">

						<form action="/user/update-notes" method="post">

							<div class="mb-3">
								<label class="form-label fw-bold">Title</label>
								<input class="form-control" type="text" name="title"
									required="required" th:value="${notes.title}" />
							</div>

							<div class="mb-3">
								<label class="form-label fw-bold">Description</label>
								<textarea rows="6" class="form-control" name="description" th:text="${notes.description}"></textarea>
							</div>

							<!-- note id fetch -->
							<input class="form-control" type="hidden" name="id" th:value="${notes.id}" />

							<div class="mt-3">
								<button type="submit" class="btn bg-wasim-btn col-md-12 text-white py-2 fs-6">Update</button>
							</div>

						</form>
					</div>

					<div class="card-footer text-center">
						<a href="/user/view-notes" class="text-secondary small"><i class="fa-solid fa-arrow-left me-1"></i>Back to Dashboard</a>
					</div>

				</div>
			</div>

			<!-- Fallback: note not found -->
			<div class="col-md-6 offset-md-3 mt-5 text-center" th:if="${notes == null}">
				<div class="alert alert-warning shadow-sm">
					<i class="fa-solid fa-triangle-exclamation me-2"></i>
					Note not found or you don't have permission to edit it.
					<hr>
					<a href="/user/view-notes" class="btn bg-wasim-btn btn-sm text-white">Back to Dashboard</a>
				</div>
			</div>

		</div>
	</div>

</section>
</body>
</html>
