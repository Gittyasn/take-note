<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{ base :: layout( ~{::title}, ~{::section} ) }">
<head>
<meta charset="UTF-8">
<title>Dashboard:: Take Note</title>
<style>
	.nav-link {
		transition: all 0.2s ease;
		border-radius: 8px;
		margin-bottom: 4px;
	}
	.nav-link:hover {
		background-color: rgba(79, 70, 229, 0.05);
		color: #4f46e5 !important;
		transform: translateX(4px);
	}
	.nav-link.active {
		border-left: 4px solid #4f46e5 !important;
	}
	.pointer-cursor {
		cursor: pointer;
	}
	.badge {
		font-weight: 500;
	}
	#notesGrid .card {
		transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
	}
	#notesGrid .card:hover {
		transform: translateY(-8px);
		box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
	}
	.btn-primary-custom {
		background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
		border: none;
	}
</style>
</head>

<body>
	<section>
		<div class="container-fluid mt-3" style="min-height: 80vh;">
			<div class="row">
				<!-- Sidebar -->
				<div class="col-md-3 bg-light p-3 border-end">
					<h4 class="text-secondary"><i class="fa-solid fa-layer-group"></i> Navigation</h4>
					<hr>
					<ul class="nav flex-column mb-auto">
					  <li class="nav-item mb-2">
						<button class="btn btn-primary-custom w-100 text-start text-white shadow-sm" onclick="openCreateModal()">
							<i class="fa-solid fa-plus me-2"></i> Create Note
						</button>
					  </li>
					  <li class="nav-item mb-1">
						<a href="javascript:void(0)" onclick="applyFilter(null)" id="filterAll" class="nav-link active bg-white shadow-sm rounded text-dark d-flex justify-content-between align-items-center">
							<span><i class="fa-solid fa-note-sticky me-2 text-primary"></i> All Notes</span>
							<span class="badge rounded-pill bg-primary" id="countAll">0</span>
						</a>
					  </li>
					  <li class="nav-item mb-1">
						<a href="javascript:void(0)" onclick="applyFilter('favorites')" id="filterFav" class="nav-link text-dark d-flex justify-content-between align-items-center">
							<span><i class="fa-solid fa-star me-2 text-warning"></i> Favorites</span>
							<span class="badge rounded-pill bg-warning text-dark" id="countFav">0</span>
						</a>
					  </li>
					  <hr class="my-2">
					  <li class="nav-item">
						<span class="nav-link text-muted small fw-bold">DYNAMIC TAGS</span>
						<div id="tagsContainer" class="px-3 d-flex flex-wrap gap-1 mt-1">
							<!-- Tags will load here -->
						</div>
					  </li>
					</ul>
				</div>

				<!-- Main Content -->
				<div class="col-md-9 p-4">
					
					<!-- Top Bar: Search -->
					<div class="row mb-4">
						<div class="col-md-8">
							<h3 class="fw-bold"><i class="fa-regular fa-clipboard text-primary"></i> My Notes Dashboard</h3>
						</div>
						<div class="col-md-4">
							<div class="input-group shadow-sm rounded">
							  <input type="text" id="searchInput" class="form-control" placeholder="Search notes...">
							  <button class="btn btn-primary-custom" style="padding-left:1.5rem; padding-right:1.5rem;" type="button" onclick="loadNotes(0)"><i class="fa-solid fa-search"></i></button>
							</div>
						</div>
					</div>

					<!-- Error / Success Alerts will show here -->
					<div id="alertPlaceholder"></div>

					<!-- Notes Grid -->
					<div class="row" id="notesGrid">
						<div class="text-center mt-5" id="loader">
							<div class="spinner-border text-primary" role="status"></div>
							<p>Loading your notes...</p>
						</div>
					</div>

					<!-- Pagination -->
					<nav class="mt-4" aria-label="Notes pagination">
					  <ul class="pagination justify-content-center" id="paginationControls">
						<!-- Inserted dynamically -->
					  </ul>
					</nav>

				</div>
			</div>
		</div>

		<!-- Add Note Modal -->
		<div class="modal fade" id="addNoteModal" tabindex="-1" aria-hidden="true">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header bg-wasim text-white">
				<h5 class="modal-title" id="modalTitle">New Note</h5>
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
			  </div>
			  <div class="modal-body">
				<form id="addNoteForm">
				  <input type="hidden" id="noteId">
				  <div class="mb-3">
					<label class="form-label fw-bold">Title</label>
					<input type="text" id="noteTitle" class="form-control" placeholder="Enter title (min 3 chars)" required>
				  </div>
				  <div class="mb-3">
					<label class="form-label fw-bold">Description</label>
					<textarea id="noteDesc" class="form-control" rows="4" placeholder="Enter description (min 10 chars)" required></textarea>
				  </div>
				  <div class="mb-3">
					<label class="form-label fw-bold">Tags</label>
					<input type="text" id="noteTags" class="form-control" placeholder="Work, Personal, Urgent (comma separated)">
				  </div>
				  <div class="form-check mb-3">
					<input class="form-check-input" type="checkbox" id="noteFav">
					<label class="form-check-label text-warning fw-bold"><i class="fa-solid fa-star"></i> Mark as Favorite</label>
				  </div>
				</form>
			  </div>
			  <div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="button" class="btn text-white bg-wasim-btn" id="saveNoteBtn" onclick="saveNote()">Save Note</button>
			  </div>
			</div>
		  </div>
		</div>

		<!-- Delete Confirmation Modal -->
		<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
		  <div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow">
			  <div class="modal-header bg-danger text-white">
				<h5 class="modal-title"><i class="fa-solid fa-triangle-exclamation"></i> Confirm Delete</h5>
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
			  </div>
			  <div class="modal-body py-4 text-center">
				<p class="fs-5 mb-0">Are you sure you want to permanently delete this note?</p>
				<small class="text-danger">This action cannot be undone.</small>
				<input type="hidden" id="deleteNoteId">
			  </div>
			  <div class="modal-footer border-0">
				<button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-danger px-4 shadow-sm" onclick="confirmDeletion()">Delete Now</button>
			  </div>
			</div>
		  </div>
		</div>

		<script>
			// Hybrid REST Fetch logic
			let currentPage = 0;
			let currentFilter = null; // 'favorites' or null
			
			// Always load JWT Token
			function getToken() {
				const match = document.cookie.match(new RegExp('(^| )JWT_TOKEN=([^;]+)'));
				return match ? match[2] : '';
			}

			function showAlert(message, type = 'success') {
				const alertObj = `<div class="alert alert-${type} alert-dismissible fade show shadow-sm" role="alert">
					${message}
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>`;
				document.getElementById('alertPlaceholder').innerHTML = alertObj;
			}

			async function loadNotes(page = 0) {
				const query = document.getElementById('searchInput').value;
				currentPage = page;
				const token = getToken();
				
				let url = `/api/notes?page=${page}&size=6&search=${query}`;
				if (currentFilter === 'favorites') {
					url += '&favoriteOnly=true';
				} else if (currentFilter && currentFilter.startsWith('tag:')) {
					url += `&tag=${encodeURIComponent(currentFilter.split(':')[1])}`;
				}

				try {
					const response = await fetch(url, {
						headers: { 'Authorization': `Bearer ${token}` }
					});
					
					if (response.ok) {
						const data = await response.json();
						renderNotes(data.content);
						renderPagination(data);
						loadStats(); // Added
						loadTags(); // Refresh tags list (decoupled)
					} else if (response.status === 401 || response.status === 403) {
						window.location.href = '/signin';
					} else {
						// For 400 or other errors, let's log them but not crash
						console.error("API error:", response.status);
					}
				} catch (err) {
					console.error("Fetch error:", err);
					showAlert('Error loading notes. Please refresh.', 'danger');
				}
			}

			async function loadStats() {
				try {
					const res = await fetch('/api/notes/stats', {
						headers: { 'Authorization': `Bearer ${getToken()}` }
					});
					if (res.ok) {
						const stats = await res.json();
						document.getElementById('countAll').innerText = stats.total;
						document.getElementById('countFav').innerText = stats.favorites;
					}
				} catch (e) { console.error(e); }
			}

			async function loadTags() {
				try {
					const res = await fetch('/api/notes/all-tags', {
						headers: { 'Authorization': `Bearer ${getToken()}` }
					});
					if (res.ok) {
						const tags = await res.json();
						const container = document.getElementById('tagsContainer');
						if(!container) return;
						container.innerHTML = '';
						
						tags.forEach(tag => {
							const active = currentFilter === `tag:${tag}` ? 'bg-success text-white' : 'bg-light text-dark';
							container.innerHTML += `<span class="badge ${active} pointer-cursor border mb-1" onclick="applyTagFilter('${tag}')">${tag}</span>`;
						});
					}
				} catch (e) {
					console.error("Failed to load tags:", e);
				}
			}

			function applyFilter(filter) {
				currentFilter = filter;
				document.getElementById('filterAll').classList.toggle('active', filter === null);
				document.getElementById('filterAll').classList.toggle('bg-white', filter === null);
				document.getElementById('filterFav').classList.toggle('active', filter === 'favorites');
				document.getElementById('filterFav').classList.toggle('bg-white', filter === 'favorites');
				loadNotes(0);
			}

			function applyTagFilter(tag) {
				if (currentFilter === `tag:${tag}`) {
					currentFilter = null;
				} else {
					currentFilter = `tag:${tag}`;
				}
				loadNotes(0);
			}

			function renderNotes(notes) {
				const grid = document.getElementById('notesGrid');
				grid.innerHTML = '';
				
				if (notes.length === 0) {
					grid.innerHTML = `<div class="col-12 text-center text-muted mt-5"><i class="fa-solid fa-inbox fa-3x mb-3"></i><p>No notes found. Create one!</p></div>`;
					return;
				}

				notes.forEach(note => {
					const isFav = note.favorite ? '<i class="fa-solid fa-star text-warning"></i>' : '<i class="fa-regular fa-star text-muted"></i>';
					const tagsHtml = (note.tags && Array.isArray(note.tags)) ? note.tags.map(t => `<span class="badge bg-light text-dark border me-1">${t}</span>`).join('') : '';
					const safeTitle = (note.title || 'Untitled').replace(/'/g,"\\'").replace(/"/g,"&quot;");
					const safeDesc = (note.description || '').replace(/'/g,"\\'").replace(/\n/g," ").replace(/"/g,"&quot;");

					const card = `
					<div class="col-md-6 col-lg-4 mb-4">
						<div class="card h-100 shadow-sm border-0 position-relative">
							<div class="position-absolute" style="top:10px; right:15px; cursor:pointer;" onclick="toggleFavorite(${note.id})">
								${isFav}
							</div>
							<div class="card-body mt-2">
								<h5 class="card-title fw-bold text-dark text-truncate pr-4">${note.title || 'Untitled'}</h5>
								<p class="card-text text-secondary mb-3" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">${note.description || ''}</p>
								<div class="mb-2">${tagsHtml}</div>
							</div>
							<div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center">
								<small class="text-muted"><i class="fa-regular fa-calendar"></i> ${note.createdAt || 'Just now'}</small>
								<div>
									<button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${JSON.stringify(note).replace(/"/g, '&quot;')})"><i class="fa-solid fa-pen"></i></button>
									<button class="btn btn-sm btn-outline-danger" onclick="deleteNote(${note.id})"><i class="fa-solid fa-trash"></i></button>
								</div>
							</div>
						</div>
					</div>`;
					grid.innerHTML += card;
				});
			}

			function renderPagination(data) {
				const container = document.getElementById('paginationControls');
				container.innerHTML = '';
				
				if (data.totalPages <= 1) return;

				// Previous Button
				const prevDisabled = data.first ? 'disabled' : '';
				container.innerHTML += `
					<li class="page-item ${prevDisabled}">
						<a class="page-link" href="javascript:void(0)" onclick="loadNotes(${data.number - 1})" aria-label="Previous">
							<span aria-hidden="true">&laquo;</span>
						</a>
					</li>`;

				// Page Numbers (Show max 5 pages around current)
				let startPage = Math.max(0, data.number - 2);
				let endPage = Math.min(data.totalPages - 1, data.number + 2);
				
				for (let i = startPage; i <= endPage; i++) {
					const activeClass = i === data.number ? 'active' : '';
					container.innerHTML += `
						<li class="page-item ${activeClass}">
							<a class="page-link" href="javascript:void(0)" onclick="loadNotes(${i})">${i + 1}</a>
						</li>`;
				}

				// Next Button
				const nextDisabled = data.last ? 'disabled' : '';
				container.innerHTML += `
					<li class="page-item ${nextDisabled}">
						<a class="page-link" href="javascript:void(0)" onclick="loadNotes(${data.number + 1})" aria-label="Next">
							<span aria-hidden="true">&raquo;</span>
						</a>
					</li>`;
			}

			let addNoteModalInstance = null;
			let deleteConfirmModalInstance = null;

			function getAddNoteModal() {
				if (!addNoteModalInstance) {
					addNoteModalInstance = new bootstrap.Modal(document.getElementById('addNoteModal'));
				}
				return addNoteModalInstance;
			}

			function getDeleteConfirmModal() {
				if (!deleteConfirmModalInstance) {
					deleteConfirmModalInstance = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
				}
				return deleteConfirmModalInstance;
			}

			function openCreateModal() {
				document.getElementById('addNoteForm').reset();
				document.getElementById('noteId').value = '';
				document.getElementById('modalTitle').innerText = 'New Note';
				document.getElementById('saveNoteBtn').innerText = 'Save Note';
				getAddNoteModal().show();
			}

			function openEditModal(note) {
				document.getElementById('noteId').value = note.id;
				document.getElementById('noteTitle').value = note.title;
				document.getElementById('noteDesc').value = note.description;
				document.getElementById('noteTags').value = note.tags ? note.tags.join(', ') : '';
				document.getElementById('noteFav').checked = note.favorite;
				document.getElementById('modalTitle').innerText = 'Edit Note';
				document.getElementById('saveNoteBtn').innerText = 'Update Note';
				getAddNoteModal().show();
			}

			async function saveNote() {
				const id = document.getElementById('noteId').value;
				const title = document.getElementById('noteTitle').value;
				const desc = document.getElementById('noteDesc').value;
				const tags = document.getElementById('noteTags').value.split(',').map(s => s.trim()).filter(s => s !== '');
				const fav = document.getElementById('noteFav').checked;

				// Clear previous errors if any
				const url = id ? `/api/notes/${id}` : '/api/notes';
				const method = id ? 'PUT' : 'POST';

				try {
					const res = await fetch(url, {
						method: method,
						headers: { 
							'Content-Type': 'application/json',
							'Authorization': `Bearer ${getToken()}` 
						},
						body: JSON.stringify({ title: title, description: desc, favorite: fav, tags: tags })
					});

					if (res.ok) {
						getAddNoteModal().hide();
						showAlert(id ? 'Note updated successfully!' : 'Note created successfully!');
						loadNotes(currentPage);
					} else {
						const errorData = await res.json();
						const errorMsg = errorData.message || 'Validation failed. Check inputs.';
						showAlert(errorMsg, 'danger');
					}
				} catch (err) {
					showAlert('Server error', 'danger');
				}
			}

			function deleteNote(id) {
				document.getElementById('deleteNoteId').value = id;
				getDeleteConfirmModal().show();
			}

			async function confirmDeletion() {
				const id = document.getElementById('deleteNoteId').value;
				const res = await fetch(`/api/notes/${id}`, {
					method: 'DELETE',
					headers: { 'Authorization': `Bearer ${getToken()}` }
				});

				if (res.ok) {
					getDeleteConfirmModal().hide();
					showAlert('Note successfully deleted!');
					loadNotes(currentPage);
				} else {
					showAlert('Error deleting note', 'danger');
				}
			}

			async function toggleFavorite(id) {
				const res = await fetch(`/api/notes/${id}/favorite`, {
					method: 'PATCH',
					headers: { 
						'Authorization': `Bearer ${getToken()}` 
					}
				});

				if(res.ok) {
					loadNotes(currentPage);
				}
			}

			// Load notes directly upon landing
			document.addEventListener("DOMContentLoaded", () => {
				loadNotes(0);
				
				// Open create modal if ?add=true is in the URL
				if (new URLSearchParams(window.location.search).has('add')) {
					openCreateModal();
				}
				
				// Live search with debounce
				let timeout;
				document.getElementById('searchInput').addEventListener('keyup', () => {
					clearTimeout(timeout);
					timeout = setTimeout(() => loadNotes(0), 500);
				});
			});
		</script>
	</section>
</body>
</html>
